# ============================================================
# A100 preset (Colab Pro / cloud — 40/80 GB VRAM)
# Matches paper settings: batch=4, seq=4096, bf16.
#
# batch_size=4 is the safe setting for a 40 GB A100: one example is up to
# 4096 tokens and gradient checkpointing still has to hold the activations
# for the whole micro-batch. On an 80 GB A100 batch_size: 8 /
# gradient_accumulation_steps: 2 fits and halves the step count — change both
# together so the effective batch stays 16.
# ============================================================

data:
  root: "transmucores_data"
  output_dir: "processed_data"
  languages:
    hi: {name: "Hindi",   codes: ["hin_Deva"]}
    ta: {name: "Tamil",   codes: ["tam_Taml"]}
    bn: {name: "Bengali", codes: ["ben_Beng"]}

preprocessing:
  instruction_id: 5
  max_tokens_per_frame: 256    # sized so instruction+input+output fits max_seq_length
  min_mentions_per_example: 1

model:
  name: "unsloth/Meta-Llama-3.1-8B-Instruct-bnb-4bit"
  max_seq_length: 4096
  load_in_4bit: true

lora:
  rank: 16
  alpha: 16
  dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

training:
  output_dir: "model_output"
  num_epochs: 3
  batch_size: 4                     # 40 GB safe; 80 GB can use 8 (see header)
  gradient_accumulation_steps: 4    # effective = 16
  learning_rate: 2.0e-4
  warmup_ratio: 0.03
  lr_scheduler: "cosine"
  weight_decay: 0.01
  max_grad_norm: 1.0
  logging_steps: 10
  save_steps: 200
  eval_steps: 200
  # Cap the dev set used for mid-training eval. The full dev split is 1,758
  # examples; evaluating all of them every eval_steps costs more GPU time than
  # it buys. 0 = use the whole split.
  eval_max_examples: 300
  bf16: true
  fp16: false
  dataloader_num_workers: 2
  seed: 42

inference:
  max_cluster_id: 200
  output_dir: "inference_output"
